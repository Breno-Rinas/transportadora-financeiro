server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Uploads de até 10 MB (limite da API) + overhead do multipart.
  client_max_body_size 12m;

  # DNS interno do Docker: reresolve `api` se o container for recriado.
  resolver 127.0.0.11 valid=10s;
  set $api_upstream http://api:3333;

  location /api/ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /uploads/ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
  }

  # Assets do Vite têm hash no nome: cache longo.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA: qualquer outra rota cai no index.html (React Router).
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
